name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install boto3 pytest pyyaml

      - name: Compile check
        run: python -m py_compile src/shorten/app.py src/redirect/app.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate
